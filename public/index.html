<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HubAll - Ferramentas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-section topbar-left">
      <span class="brand">HubAll</span>
    </div>

    <div class="topbar-section topbar-center">
      <div class="tool-switcher">
        <button type="button" id="toolSwitcherBtn" class="tool-pill" aria-haspopup="true" aria-expanded="false">
          <svg class="tool-pill-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span id="currentToolName">Remover Fundo de Imagem</span>
          <svg class="tool-pill-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <div id="toolMenu" class="tool-menu" hidden>
          <button type="button" class="tool-item" data-tool="remove-background">
            <span class="tool-item-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </span>
            <span class="tool-item-name">Remover Fundo de Imagem</span>
            <svg class="tool-item-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </button>

          <button type="button" class="tool-item" data-tool="download-video">
            <span class="tool-item-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            </span>
            <span class="tool-item-name">Baixar Vídeo</span>
            <svg class="tool-item-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="topbar-section topbar-right">
      <button type="button" id="themeToggle" class="icon-btn" aria-label="Alternar tema">
        <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="hero">
    <div class="hero-text">
      <h1 id="toolTitle">Converta seu arquivo</h1>
      <p id="toolSubtitle">Envie uma imagem para remover o fundo automaticamente.</p>
    </div>

    <form id="toolForm" class="composer" novalidate>
      <div class="composer-field" id="fieldFile">
        <span class="composer-field-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        </span>
        <span class="composer-field-text" id="fileFieldText">Arraste uma imagem aqui ou clique para selecionar</span>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden />
      </div>

      <div class="composer-field" id="fieldLink" hidden>
        <span class="composer-field-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        </span>
        <input type="url" id="linkInput" class="composer-link-input" placeholder="Cole o link do vídeo" />
      </div>

      <select id="videoQuality" class="quality-select" hidden>
        <option value="best">Melhor qualidade</option>
        <option value="1080p">1080p (Full HD)</option>
        <option value="720p">720p (HD)</option>
        <option value="audio">Apenas áudio (MP3)</option>
      </select>

      <button type="submit" class="btn-primary" id="actionBtn">Remover fundo</button>
    </form>

    <p class="hint" id="toolHint">Suporta arrastar e soltar &middot; JPEG, PNG, WEBP &middot; até 15MB</p>

    <div id="statusArea" class="status" role="status"></div>
    <div id="previewArea" class="preview"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
