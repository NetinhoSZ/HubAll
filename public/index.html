<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>HubAll - Ferramentas</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    section { margin-bottom: 48px; padding-bottom: 24px; border-bottom: 1px solid #ddd; }
    #dropzone {
      border: 2px dashed #999;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      color: #666;
    }
    #dropzone.dragover { border-color: #333; background: #f5f5f5; }
    #preview { margin-top: 20px; text-align: center; }
    #preview img { max-width: 100%; border-radius: 8px; }
    #status { margin-top: 12px; text-align: center; }
    a#download { display: inline-block; margin-top: 12px; }
    #videoForm { display: flex; flex-direction: column; gap: 10px; }
    #videoForm input, #videoForm select, #videoForm button { padding: 8px; font-size: 14px; }
    #videoStatus { margin-top: 12px; text-align: center; }
    a#videoDownload { display: inline-block; margin-top: 12px; }
  </style>
</head>
<body>
  <section>
    <h1>Remover Fundo de Imagem</h1>

    <div id="dropzone">
      Arraste uma imagem aqui ou clique para selecionar
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden />
    </div>

    <div id="status"></div>
    <div id="preview"></div>
  </section>

  <section>
    <h1>Baixar Video</h1>

    <form id="videoForm">
      <input type="url" id="videoUrl" placeholder="Cole o link do video" required />
      <select id="videoQuality">
        <option value="best">Melhor qualidade disponivel</option>
        <option value="1080p">1080p (Full HD)</option>
        <option value="720p">720p (HD)</option>
        <option value="audio">Apenas audio (MP3)</option>
      </select>
      <button type="submit">Baixar</button>
    </form>

    <div id="videoStatus"></div>
    <div id="videoPreview"></div>
  </section>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    dropzone.addEventListener("click", () => fileInput.click());

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));

    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener("change", () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    async function handleFile(file) {
      preview.innerHTML = "";
      status.textContent = "Processando... (pode levar alguns segundos)";

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch("/api/tools/remove-background", {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || "Erro ao processar imagem.");
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        status.textContent = "Pronto!";
        preview.innerHTML = `
          <img src="${url}" alt="Imagem sem fundo" />
          <br />
          <a id="download" href="${url}" download="sem-fundo.png">Baixar imagem</a>
        `;
      } catch (err) {
        status.textContent = err.message;
      }
    }

    const videoForm = document.getElementById("videoForm");
    const videoUrl = document.getElementById("videoUrl");
    const videoQuality = document.getElementById("videoQuality");
    const videoStatus = document.getElementById("videoStatus");
    const videoPreview = document.getElementById("videoPreview");

    videoForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      videoPreview.innerHTML = "";
      videoStatus.textContent = "Baixando... (pode levar alguns minutos)";

      try {
        const response = await fetch("/api/tools/download-video", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: videoUrl.value, quality: videoQuality.value }),
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || "Erro ao baixar video.");
        }

        const disposition = response.headers.get("Content-Disposition") || "";
        const filenameMatch = disposition.match(/filename="?([^"]+)"?/);
        const filename = filenameMatch ? filenameMatch[1] : "video";

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        videoStatus.textContent = "Pronto!";
        videoPreview.innerHTML = `<a id="videoDownload" href="${url}" download="${filename}">Baixar arquivo</a>`;
      } catch (err) {
        videoStatus.textContent = err.message;
      }
    });
  </script>
</body>
</html>
